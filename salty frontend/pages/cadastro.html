<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Criar conta | SALTY</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/responsive.css"></head><body data-root="../"><div id="site-header"></div><main id="main"><section class="container auth"><form id="cadastroForm" class="panel" novalidate><h1>Criar conta</h1><div class="field"><label for="nome">Nome</label><input id="nome" name="nome" type="text" required autocomplete="name"><small class="field__error" role="alert"></small></div><div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" required ><small class="field__error" role="alert"></small></div><div class="field"><label for="telefone">Telefone</label><input id="telefone" name="telefone" type="tel" required data-mask="tel" data-validate="tel"><small class="field__error" role="alert"></small></div><div class="field"><label for="senha">Senha</label><input id="senha" name="senha" type="password" required minlength="6"><small class="field__error" role="alert"></small></div><div class="field"><label for="confirmar">Confirmar senha</label><input id="confirmar" name="confirmar" type="password" required data-match="senha"><small class="field__error" role="alert"></small></div><button class="btn btn--primary btn--block">Cadastrar</button><p class="auth__links">Já tem conta? <a href="login.html">Entrar</a></p></form></section></main><div id="site-footer"></div><script src="../js/main.js"></script><script src="../js/produtos.js"></script><script src="../js/carrinho.js"></script><script src="../js/auth.js"></script></body></html>
