<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Finalizar pedido | SALTY</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/responsive.css"></head><body data-root="../"><div id="site-header"></div><main id="main"><section class="container section"><h1 class="section__title">Finalizar pedido</h1>
<div class="two-col" id="checkoutArea"><form id="checkoutForm" class="panel" novalidate><h2>Seus dados</h2><div class="form-grid"><div class="field"><label for="nome">Nome</label><input id="nome" name="nome" type="text" required autocomplete="name"><small class="field__error" role="alert"></small></div><div class="field"><label for="telefone">Telefone</label><input id="telefone" name="telefone" type="tel" required data-mask="tel" data-validate="tel" autocomplete="tel"><small class="field__error" role="alert"></small></div><div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" required autocomplete="email"><small class="field__error" role="alert"></small></div></div>
<h2>Entrega</h2><div class="form-grid"><div class="field"><label for="cep">CEP</label><input id="cep" name="cep" type="text" required data-mask="cep" data-validate="cep" inputmode="numeric"><small class="field__error" role="alert"></small></div><div class="field"><label for="rua">Rua</label><input id="rua" name="rua" type="text" required ><small class="field__error" role="alert"></small></div><div class="field"><label for="numero">Número</label><input id="numero" name="numero" type="text" required ><small class="field__error" role="alert"></small></div><div class="field"><label for="complemento">Complemento</label><input id="complemento" name="complemento" type="text"  ><small class="field__error" role="alert"></small></div><div class="field"><label for="bairro">Bairro</label><input id="bairro" name="bairro" type="text" required ><small class="field__error" role="alert"></small></div><div class="field"><label for="cidade">Cidade</label><input id="cidade" name="cidade" type="text" required ><small class="field__error" role="alert"></small></div><div class="field"><label for="estado">Estado</label><select id="estado" name="estado" required><option value="">Selecione</option><option>AC</option><option>AL</option><option>AP</option><option>AM</option><option>BA</option><option>CE</option><option>DF</option><option>ES</option><option>GO</option><option>MA</option><option>MT</option><option>MS</option><option>MG</option><option>PA</option><option>PB</option><option>PR</option><option>PE</option><option>PI</option><option>RJ</option><option>RN</option><option>RS</option><option>RO</option><option>RR</option><option>SC</option><option>SP</option><option>SE</option><option>TO</option></select><small class="field__error" role="alert"></small></div></div>
<h2>Pagamento</h2><div class="pay"><label><input type="radio" name="pagamento" value="Pix" checked> Pix</label><label><input type="radio" name="pagamento" value="Dinheiro"> Dinheiro</label><label><input type="radio" name="pagamento" value="Cartão na entrega"> Cartão na entrega</label></div>
<div class="field"><label for="observacoes">Observações do pedido</label><textarea id="observacoes" name="observacoes" rows="3"></textarea></div><button class="btn btn--primary btn--block" type="submit">Confirmar pedido</button></form><aside class="summary" id="checkoutSummary"></aside></div>
<div class="panel done" id="pedidoOk" hidden><h2>Pedido confirmado!</h2><p>Número do pedido: <strong id="numeroPedido"></strong></p><p>Avisaremos pelo telefone informado quando ele sair para entrega.</p><a class="btn btn--primary" href="cardapio.html">Pedir mais</a></div></section></main><div id="site-footer"></div><script src="../js/main.js"></script><script src="../js/produtos.js"></script><script src="../js/carrinho.js"></script><script src="../js/checkout.js"></script></body></html>
