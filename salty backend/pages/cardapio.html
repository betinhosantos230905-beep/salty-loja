<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cardápio | SALTY</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-root="../">
  <div id="site-header"></div>
  
  <main id="main">
    <section class="container section">
      <h1 class="section__title">Cardápio</h1>
      
      <div class="toolbar">
        <input id="busca" type="search" placeholder="Buscar salgado..." aria-label="Buscar produtos">
        <select id="ordem" aria-label="Ordenar">
          <option value="">Ordenar por</option>
          <option value="asc">Menor preço</option>
          <option value="desc">Maior preço</option>
          <option value="nome">Nome (A-Z)</option>
        </select>
      </div>
      
      <div class="chips" id="filtros"></div>
      
      <div class="grid" id="grid"></div>
      
      <p class="empty" id="vazio" hidden>Nenhum produto encontrado. Tente outra busca ou categoria.</p>
    </section>
  </main>
  
  <div id="site-footer"></div>
  
  <script src="../js/main.js"></script>
  <script src="../js/produtos.js"></script>
  <script src="../js/carrinho.js"></script>
</body>
</html>
